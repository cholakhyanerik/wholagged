[project]
name = "dota-netcheck"
version = "0.1.0"
description = "Dota 2 network check: is it your internet, your provider or Valve's servers?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Erik" }
]
requires-python = ">=3.15"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
dota-netcheck = "dota_netcheck:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
