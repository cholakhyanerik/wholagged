[project]
name = "wholagged"
version = "0.3.3"
description = "wholagged: is it your internet, your provider or Valve's servers? A network check for Dota 2."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    { name = "Erik" }
]
requires-python = ">=3.15"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
wholagged = "wholagged:main"
dota-netcheck = "wholagged:main"  # deprecated alias (WL-12), kept so old commands work

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build ignores .gitignore: never ship secrets or junk dropped into src/ (CLAUDE.md rule 9)
source-exclude = [
    "**/.env*", "**/.dev.vars", "**/.pypirc", "**/.npmrc", "**/.netrc",  # the secret files .gitignore lists
    "**/*.pem", "**/*.key", "**/*.pfx", "**/*.p12", "**/id_rsa*", "**/id_ed25519*", "**/id_ecdsa*",
    "**/*.tmp", "**/*.log", "**/*.bak", "**/*.orig", "**/*.rej",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's default rule set plus flake8-bandit security rules (CLAUDE.md rule 9).
extend-select = ["S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain assert is how pytest works
".claude/hooks/*" = ["S603", "S607"]  # hooks run fixed tools (git, uv, gh) from PATH

[tool.ruff.lint.isort]
known-local-folder = ["fakes"]  # tests/fakes.py: the fake network

[tool.pytest]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]  # no .pytest_cache junk in the repo
