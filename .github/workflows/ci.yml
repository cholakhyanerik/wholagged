# Lint and offline tests for code pushes to main and pull requests. Kept cheap on purpose: see the ci-workflow skill.
name: CI

on:
  push:
    branches: [main]
    paths: &code-paths
      - "src/**"
      - "tests/**"
      - ".claude/hooks/**" # tests/test_claude_hooks.py tests the guard hook
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/**"
      - "README*.md" # tests/test_docs.py checks the commands players copy from them
      - "alias/**" # the dota-netcheck package: tests/test_alias.py and tests/test_docs.py
      - "LICENSE" # tests/test_alias.py compares the alias's copy with it
  pull_request:
    paths: *code-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest] # Windows is the main platform
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv is the newest version this pinned action ships a checksum for, so a new uv arrives only with a
      # reviewed bump of the pin. No cache: on Linux a cold `uv sync` took 2 s, saving the cache 4 s, and every
      # version bump changes the cache key anyway.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          require-checksums: true
          enable-cache: false
      - run: uv sync --locked
      - run: uv run ruff check
        if: runner.os == 'Linux' # lint results don't depend on the OS
      - run: uv run pytest -q
