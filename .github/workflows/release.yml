# Publishes wholagged to PyPI with Trusted Publishing (OIDC: PyPI trusts this file and the `pypi` environment,
# so no token is stored anywhere) when a GitHub release is published. A manual run only builds, as a dry run.
# Kept cheap and locked down on purpose: see the ci-workflow skill.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch: # build only: the publish job never runs by hand

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-done upload

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          require-checksums: true
          enable-cache: false # never a cache in a release job
      - name: The release tag is the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }} # through env, never pasted into the script
        run: |
          version="$(uv version --short --frozen)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG is not the package version v$version"
            exit 1
          fi
      - run: uv python install # the version in .python-version, checksum-verified by uv
      # Offline: only uv's bundled uv_build may build. If uv ever outgrows the [build-system] range, this fails
      # instead of quietly downloading a build backend into the job whose output ships to users.
      - run: uv build --no-sources --offline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # A job of its own, so the OIDC permission never reaches the checkout or the build.
  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi # only tags v* may deploy to it (repo settings)
      url: https://pypi.org/project/wholagged/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: latest-known
          require-checksums: true
          enable-cache: false
      - run: uv publish --trusted-publishing always dist/*
